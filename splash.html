<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启动中</title>
<style>
  /*
   * 开机动画 · 三段式（参考用户给的两段视频）
   *   ① 0.0~1.9s  品牌页：纯黑 + 白色「梅」标志 + 中英名，一束斜光扫过      ← 视频1 开头
   *   ② 1.9~4.3s  启动段：标志上移，细线进度 + 等宽字状态逐条推进            ← 原来那套
   *   ③ 4.3~5.4s  显影段：一道横向光扫过，主界面的「骨架」从渐变里浮出来      ← 视频2 的渐变显影
   * 之后主进程把这一窗渐渐淡掉，露出下面已经在跑的真界面（同一个位置、同样大小），
   * 所以最后一步不是「切窗口」，而是「同一块屏由虚到实」。
   */
  :root{
    --accent:#ff9f1a;
    --accent2:#ffd166;
    --ink:#eef2f6;
    --faint:#8d97a2;
    --bg:#05070a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:default;
    display:grid;place-items:center;
  }

  /* ---------- 背景层：颗粒 + 呼吸光 + 斜光 ---------- */
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
  }
  .halo{
    position:fixed;left:50%;top:46%;width:1100px;height:1100px;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(255,159,26,.085),rgba(255,159,26,.02) 42%,transparent 66%);
    animation:halo 6s ease-in-out infinite alternate;
  }
  @keyframes halo{from{opacity:.55;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
  /* 斜光：视频1 里那条慢慢扫过屏幕的光带 */
  .beam{
    position:fixed;top:-30%;bottom:-30%;left:-45%;width:42%;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.055) 42%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.055) 58%,transparent);
    transform:rotate(14deg);
    animation:beam 4.4s cubic-bezier(.4,0,.3,1) .2s forwards;
  }
  @keyframes beam{
    0%{left:-45%;opacity:0}
    18%{opacity:1}
    100%{left:105%;opacity:0}
  }

  /* ---------- 四角标注 ---------- */
  .corner{
    position:fixed;z-index:3;font-family:Consolas,"Cascadia Mono",monospace;
    font-size:11px;letter-spacing:2.4px;color:#39424d;text-transform:uppercase;
    opacity:0;animation:fadeIn .6s ease .95s forwards;
  }
  .corner.tl{left:44px;top:34px}
  .corner.tr{right:44px;top:34px}
  .corner.bl{left:44px;bottom:34px}
  .corner.br{right:44px;bottom:34px}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- 主体 ---------- */
  .stage{position:relative;z-index:4;text-align:center;
    transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .7s ease}
  body.p2 .stage{transform:translateY(-52px)}
  /* 第三段把文字层压暗：交接的那一帧只留「界面骨架」，淡入真界面时才不打架 */
  body.p3 .stage{opacity:0}

  .mark{
    width:104px;height:104px;margin:0 auto 30px;border-radius:50%;
    display:grid;place-items:center;position:relative;
    color:#fff;font-size:52px;font-weight:800;line-height:1;
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.14),rgba(255,255,255,.02) 62%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 0 60px rgba(255,255,255,.06),0 0 0 10px rgba(255,255,255,.014);
    animation:markIn 1.1s cubic-bezier(.16,1,.3,1) .1s backwards;
    transition:width .8s cubic-bezier(.16,1,.3,1),height .8s cubic-bezier(.16,1,.3,1),
               font-size .8s cubic-bezier(.16,1,.3,1),margin .8s cubic-bezier(.16,1,.3,1);
  }
  body.p2 .mark{width:72px;height:72px;font-size:36px;margin-bottom:18px}
  .mark::after{
    content:"";position:absolute;inset:-1px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 62%,rgba(255,159,26,.55) 78%,transparent 90%);
    -webkit-mask:radial-gradient(circle,transparent 49%,#000 51%);
    mask:radial-gradient(circle,transparent 49%,#000 51%);
    animation:spin 3.4s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes markIn{
    from{opacity:0;transform:scale(.82);filter:blur(8px)}
    to{opacity:1;transform:none;filter:none}
  }

  h1{
    margin:0;font-size:30px;font-weight:750;letter-spacing:.30em;text-indent:.30em;
    animation:riseIn .9s cubic-bezier(.16,1,.3,1) .55s backwards;
    transition:font-size .8s cubic-bezier(.16,1,.3,1);
  }
  body.p2 h1{font-size:22px}
  .en{
    margin-top:14px;font-family:Consolas,"Cascadia Mono",monospace;
    font-size:11.5px;letter-spacing:5px;color:var(--faint);text-transform:uppercase;
    animation:riseIn .9s cubic-bezier(.16,1,.3,1) .75s backwards;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 名字下面那条从中间展开的细线 */
  .rule{height:1px;width:0;margin:26px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,159,26,.85),transparent);
    animation:rule .9s cubic-bezier(.16,1,.3,1) 1.15s forwards}
  @keyframes rule{to{width:340px}}

  /* ---------- 进度 ---------- */
  .meter{
    width:420px;margin:38px auto 0;display:flex;align-items:center;gap:14px;
    opacity:0;animation:fadeIn .5s ease .55s forwards;
  }
  .meter .bar{position:relative;flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
  .meter .bar i{position:absolute;inset:0 auto 0 0;width:0;
    background:linear-gradient(90deg,rgba(255,209,102,.35),var(--accent));
    box-shadow:0 0 12px rgba(255,159,26,.55);
    transition:width .34s cubic-bezier(.22,.61,.36,1)}
  /* 进度追上来、但页面还没 ready：在条子上跑一层流光，别让人以为卡死 */
  body.waiting .meter .bar i::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:translateX(-100%);animation:flow 1.1s linear infinite;
  }
  @keyframes flow{to{transform:translateX(100%)}}
  .pct{font-family:Consolas,"Cascadia Mono",monospace;font-size:11px;letter-spacing:1px;
    color:var(--accent);min-width:42px;text-align:right}
  .status{
    width:420px;margin:14px auto 0;display:flex;justify-content:space-between;
    font-family:Consolas,"Cascadia Mono",monospace;font-size:11px;letter-spacing:1.6px;
    color:#404a55;text-transform:uppercase;
    opacity:0;animation:fadeIn .5s ease .64s forwards;
  }
  .status .step{color:var(--faint)}
  .status .step::before{content:"› ";color:var(--accent)}

  /* ---------- 第三段：一条细光把界面「撑」出来 ---------- */
  /*
   * 2026-10-26 用户：「横向光扫过这里我觉得可以改，过渡要承上启下一些」。
   * 原来是「一道斜光 + 骨架整块淡入」，两段之间没有因果关系，像两次切页。
   * 现在改成**有动作连续性的三步**：
   *   ① 标志位置拉出一条细光，横着铺满整屏宽
   *   ② 细光升到顶栏下沿（y=64），顶栏像被它「拉下来」一样从 top 展开（scaleY）
   *   ③ 顶栏里的图标/导航逐个亮起，两块面板带着模糊+阴影从下方浮起
   * 这样「开机画面」和「主界面」之间是同一根线在长大，而不是换了一个画面。
   */
  .ghost{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
  body.p3 .ghost{opacity:1}

  /* ① 那根细光 */
  .hairline{
    position:absolute;left:50%;top:46%;height:1px;width:0;opacity:0;
    transform:translate(-50%,-50%);
    background:linear-gradient(90deg,transparent,rgba(255,159,26,.9) 24%,#fff 50%,rgba(255,159,26,.9) 76%,transparent);
    box-shadow:0 0 22px rgba(255,159,26,.6);
  }
  body.p3 .hairline{animation:hairline .86s cubic-bezier(.5,0,.2,1) both}
  @keyframes hairline{
    0%{opacity:0;width:0;top:46%}
    14%{opacity:1;width:44%}
    40%{opacity:1;width:100%;top:46%}
    66%{opacity:.95;width:100%;top:64px}
    100%{opacity:0;width:100%;top:64px}
  }

  .ghost .glow{
    position:absolute;left:50%;top:-320px;width:1200px;height:760px;transform:translateX(-50%);
    border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,rgba(255,159,26,.10),rgba(255,159,26,.03) 46%,transparent 70%);
  }
  body.p3 .ghost .glow{animation:fadeIn .8s ease .4s both}

  /* ② 顶栏「被拉下来」 */
  .ghost .topbar{
    position:absolute;left:0;right:0;top:0;height:64px;
    display:flex;align-items:center;padding:0 40px;gap:14px;
    transform-origin:top center;opacity:0;
    background:linear-gradient(180deg,rgba(12,17,23,.94),rgba(12,17,23,.62));
    border-bottom:1px solid rgba(255,255,255,.07);
    box-shadow:0 18px 40px -28px #000,inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(8px);
  }
  body.p3 .ghost .topbar{animation:barIn .46s cubic-bezier(.16,1,.3,1) .38s both}
  @keyframes barIn{from{opacity:0;transform:scaleY(.02)}to{opacity:1;transform:scaleY(1)}}
  /* 顶栏亮起来时顺着扫一道高光 */
  .ghost .topbar::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(100deg,transparent 34%,rgba(255,255,255,.20) 50%,transparent 66%);
  }
  body.p3 .ghost .topbar::after{animation:sheen .8s ease .56s both}
  @keyframes sheen{0%{opacity:0;transform:translateX(-35%)}28%{opacity:1}100%{opacity:0;transform:translateX(35%)}}

  .ghost .topbar .m{
    width:26px;height:26px;border-radius:8px;opacity:0;
    background:linear-gradient(150deg,#ffb347,#e0890f);
    box-shadow:0 6px 22px rgba(255,159,26,.45),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .ghost .topbar .t{height:9px;width:120px;border-radius:5px;background:rgba(255,255,255,.30);opacity:0}
  .ghost .topbar .n{margin-left:auto;display:flex;gap:22px}
  .ghost .topbar .n i{display:block;height:7px;width:46px;border-radius:4px;background:rgba(255,255,255,.16);opacity:0}
  body.p3 .ghost .topbar .m{animation:popIn .46s cubic-bezier(.16,1,.3,1) .56s both}
  body.p3 .ghost .topbar .t{animation:popIn .46s cubic-bezier(.16,1,.3,1) .63s both}
  body.p3 .ghost .topbar .n i:nth-child(1){animation:popIn .40s ease .69s both}
  body.p3 .ghost .topbar .n i:nth-child(2){animation:popIn .40s ease .74s both}
  body.p3 .ghost .topbar .n i:nth-child(3){animation:popIn .40s ease .79s both}
  body.p3 .ghost .topbar .n i:nth-child(4){animation:popIn .40s ease .84s both}
  @keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}

  /* ③ 面板：模糊 → 清晰 + 抬起来 */
  .ghost .panels{
    position:absolute;left:40px;right:40px;top:104px;display:grid;
    grid-template-columns:1.6fr 1fr;gap:16px;
    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 52%,transparent 92%);
    mask-image:linear-gradient(180deg,#000 0,#000 52%,transparent 92%);
  }
  .ghost .panels div{
    border-radius:14px;border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.014));
    box-shadow:0 26px 60px -34px #000,inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
    opacity:0;
  }
  .ghost .panels div:first-child{height:300px}
  .ghost .panels div:last-child{height:220px}
  body.p3 .ghost .panels div{animation:panelIn .68s cubic-bezier(.16,1,.3,1) both}
  body.p3 .ghost .panels div:nth-child(1){animation-delay:.58s}
  body.p3 .ghost .panels div:nth-child(2){animation-delay:.68s}
  @keyframes panelIn{
    from{opacity:0;transform:translateY(30px) scale(.985);filter:blur(14px)}
    to{opacity:1;transform:none;filter:none}
  }

  .skip{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;
    font-family:Consolas,"Cascadia Mono",monospace;font-size:10.5px;letter-spacing:2.2px;
    color:#333c46;opacity:0;animation:fadeIn .6s ease 1.5s forwards;transition:opacity .3s;
  }
  body.p3 .skip{opacity:0!important;animation:none}

  @media (prefers-reduced-motion:reduce){
    .beam,.halo,.mark::after{animation:none}
    .beam{opacity:.5;left:40%}
  }
</style>
</head>
<body class="p1">
<div class="halo"></div>
<div class="beam"></div>
<div class="grain"></div>

<div class="corner tl">CS2 · REPLAY TERMINAL</div>
<div class="corner tr">BUILD 1.0 · LOCAL</div>
<div class="corner bl">127.0.0.1</div>
<div class="corner br">AWPY · WASM</div>

<div class="ghost">
  <div class="glow"></div>
  <i class="hairline"></i>
  <div class="topbar">
    <i class="m"></i><b class="t"></b>
    <span class="n"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="panels"><div></div><div></div></div>
</div>

<div class="stage">
  <div class="mark">梅</div>
  <h1>梅花幼儿园复盘部</h1>
  <div class="en">Counter-Strike 2 · Replay Terminal</div>
  <div class="rule"></div>

  <div class="meter">
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct">0%</div>
  </div>
  <div class="status">
    <span class="step" id="step">初始化内核</span>
    <span id="tip">initializing</span>
  </div>
</div>
<div class="skip" id="skip">点击任意处跳过</div>

<script>
/*
 * 进度条不再「演」了 —— 2026-10-26 用户：「启动有点慢，把开机动画那个进度条
 * 做成确实是在启动中的」。
 *
 * 现在每一格都对应主进程真实发生的事：
 *   本地服务起好 → 开始加载页面 → DOM 解析完 → 资源加载完 → 字体就绪/首屏绘制 → 就绪
 * 主进程用 IPC 一条条推过来（boot:step），这里只负责「只进不退」地画；
 * 页面如果在 1 秒内就 ready，这段开场就 1 秒收尾，不会硬撑。
 *
 * ⚠️ 没有 boot API 时（直接双击 splash.html 预览）退回一套模拟节拍，方便单独看动画。
 */
(function () {
  var body = document.body;
  var fill = document.getElementById('fill');
  var pct  = document.getElementById('pct');
  var step = document.getElementById('step');
  var tip  = document.getElementById('tip');

  var cur = 0, finished = false, firstAt = 0, fallbackTimer = 0;
  var p2At = 0, barOpen = false, pendingFinal = false;
  var MIN_P2 = 1500;          // 启动段至少停 1.5s：太快就像闪屏，没有「高级」可言
  var HOLD = 96;              // 页面 ready 太早时，条子先卡在 96%

  function toP2() {
    if (body.classList.contains('p2') || body.classList.contains('p3')) return;
    p2At = p2At || Date.now();
    body.classList.replace('p1', 'p2');
  }
  /*
   * ① 品牌页至少亮 1600ms（用户：「开启动画还是要给余时间，这样才高级些」）
   *    到点之后进入 ② 启动段；再等 620ms 才允许进度条补满 ——
   *    否则页面 800ms 就加载完了，条子会在品牌页里悄悄跑满，等于没演。
   */
  setTimeout(function () {
    toP2();
    setTimeout(function () {
      barOpen = true;
      if (pendingFinal) { paint(100); reveal(); }
    }, 620);
  }, 1600);

  function paint(v) {
    cur = Math.min(100, Math.max(cur, v | 0));
    fill.style.width = cur + '%';
    pct.textContent = cur + '%';
  }

  function setStep(s) {
    if (finished || !s) return;
    firstAt = firstAt || Date.now();
    if (s.label) step.textContent = s.label;
    if (s.en) tip.textContent = s.en;

    if (s.pct >= 100) {
      // 真到 100 了，但启动段还没站稳 → 先压到 96%，等 barOpen 再补满
      if (!barOpen) { pendingFinal = true; paint(HOLD); }
      else { paint(100); reveal(); }
    } else {
      paint(Math.min(s.pct, HOLD));
    }
    // 卡在中间等页面时给条子加流光；到 100 就停
    body.classList.toggle('waiting', cur >= 40 && cur < 100);
  }

  function reveal() {
    if (finished) return;
    finished = true;
    clearTimeout(fallbackTimer);
    /*
     * 页面加载太快时（本地站往往 1 秒内就 ready），进度条只会闪一下 ——
     * 那就等于没做。这里补一个下限：进度条至少要露 520ms 再收尾。
     */
    var seen = Date.now() - p2At;
    if (p2At && seen < MIN_P2) {
      setTimeout(revealNow, MIN_P2 - seen);
      return;
    }
    revealNow();
  }
  function revealNow() {
    paint(100);
    step.textContent = '就绪';
    tip.textContent = 'ready';
    body.classList.remove('waiting');
    body.classList.add('p3');
    [].forEach.call(document.querySelectorAll('.corner,.skip'), function (el) {
      el.style.display = 'none';
    });
    // 第三段的编排大约 1.1s，之后交给主进程淡出这一窗
    setTimeout(function () {
      try { window.boot && window.boot.done(); } catch (e) {}
    }, 1080);
  }

  function skip() {
    if (finished) return;
    reveal();
  }
  window.addEventListener('mousedown', skip);
  window.addEventListener('keydown', skip);

  try {
    window.boot && window.boot.onStep(setStep);
    window.boot && window.boot.onFadeOut(function () {
      body.style.transition = 'opacity .18s linear';
      body.style.opacity = '0';
    });
  } catch (e) {}

  /* 预览模式（没有 boot API）：按一套模拟节拍走一遍，方便单独调动画 */
  if (!window.boot) {
    var SIM = [
      { pct: 18, label: '本地服务就绪', en: 'server up', ms: 260 },
      { pct: 34, label: '开始加载页面', en: 'navigate', ms: 300 },
      { pct: 56, label: '解析页面结构', en: 'dom ready', ms: 340 },
      { pct: 74, label: '加载地图与战报数据', en: 'assets', ms: 360 },
      { pct: 92, label: '首屏绘制', en: 'first paint', ms: 320 },
      { pct: 100, label: '就绪', en: 'ready', ms: 200 }
    ];
    var k = 0;
    setTimeout(function () {
      (function sim() {
        if (finished) return;
        if (k >= SIM.length) return;
        setStep(SIM[k++]);
        setTimeout(sim, SIM[k - 1] ? SIM[k - 1].ms : 300);
      })();
    }, 500);
  } else {
    /*
     * 超时兜底：主进程那边万一一个事件都没发（比如服务起不来），
     * 3.2 秒后自己走到 90% 并停下等主进程的 6 秒强制放行，别让界面干等着。
     */
    fallbackTimer = setTimeout(function () {
      if (finished) return;
      toP2();
      paint(90);
      step.textContent = '仍在载入';
      tip.textContent = 'still loading';
      body.classList.add('waiting');
    }, 3200);
  }
})();
</script>
</body>
</html>
